version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: oxc-transform-react
    groups:
      dev-patch:
        dependency-type: development
        update-types: [patch]
      dev-minor:
        dependency-type: development
        update-types: [minor]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-bun
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
