name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Lint commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun commitlint --from "$FROM" --to "$TO" --verbose

      - name: Lint the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun commitlint

  check:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run check:ci

      - name: Typecheck
        run: bun run typecheck

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Restore the Monero binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/monero
          key: monero-linux-x64-${{ hashFiles('src/server/monero/bundle.ts') }}

      - name: Fetch the Monero binary
        run: bun scripts/fetch-monero.ts

      - name: Test
        run: bun run test

  platforms:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Restore the Monero binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/monero
          key: monero-${{ matrix.platform }}-${{ hashFiles('src/server/monero/bundle.ts') }}

      - name: Build
        run: bun run package

      - name: Smoke test
        run: bun run package:smoke

      - name: Package lint report
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends lintian
          lintian --fail-on none --no-tag-display-limit dist/packages/*.deb

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/packages/*.deb
            dist/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build packages
    needs: platforms
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check all platforms
        env:
          RESULT: ${{ needs.platforms.result }}
        run: test "$RESULT" = success
